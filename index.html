<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #9bd7ff;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#171f29;border-bottom:1px solid var(--line);padding:10px 12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:750px;margin:auto}h1{font-size:14px;letter-spacing:.08em;margin:0 0 2px}.time{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums}.controls{display:flex;gap:5px}header button,.reset{border:1px solid #536577;border-radius:8px;background:#293747;color:white;padding:8px;font-size:12px}.primary{background:#28674d!important;border-color:#48976d!important}
main{max-width:750px;margin:auto;padding:12px 9px 152px}.summary{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:0 3px 10px;gap:10px}.ghost-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.ghost{border:1px solid #40505f;border-radius:9px;background:#1d2834;color:#f0f3f7;min-height:56px;padding:9px 3px;font-weight:650;font-size:clamp(12px,3.7vw,17px);overflow-wrap:anywhere;line-height:1.25}.ghost:active{background:#2b4051}.empty{grid-column:1/-1;text-align:center;padding:28px 10px;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#171f29;border-top:1px solid #465563;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.evidence{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:750px;margin:auto}.ev{height:66px;min-width:0;position:relative;border:1px solid #576a7a;border-radius:7px;background:#273441;color:#e0e7ee;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;overflow:hidden;padding:2px 0}.ev svg{width:26px;height:29px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ev small{font-size:9px;white-space:nowrap;line-height:1.15}.ev small.writing-label{font-size:8px}.ev.yes{color:#92edb5;background:#1b3b30;border-color:#55bd85}.ev.no{color:#687783;background:#202932;border-color:#59616b}.ev.no:after{content:"";position:absolute;left:-20%;top:50%;width:140%;height:3px;background:#ef6e70;transform:rotate(-45deg);pointer-events:none}.resetrow{max-width:750px;margin:7px auto 0;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#a8b7c6;font-size:10px}.reset{padding:4px 7px;font-size:11px}
.overlay{position:fixed;inset:0;z-index:10;background:#0009;opacity:0;pointer-events:none;transition:opacity .22s}.overlay.open{opacity:1;pointer-events:auto}.sheet{position:fixed;right:0;top:0;bottom:0;z-index:11;width:80%;max-width:600px;background:#1a2530;border-left:1px solid #526475;transform:translateX(101%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px #0006}.sheet.open{transform:translateX(0)}.sheethead{display:flex;justify-content:space-between;align-items:center;padding:16px 14px;border-bottom:1px solid #435463;gap:8px}.sheethead h2{margin:0;font-size:21px}.close{border:1px solid #667a8b;background:#2b3947;color:#fff;border-radius:8px;padding:7px 11px}.sheetbody{overflow-y:auto;overscroll-behavior:contain;padding:15px 15px 30px;line-height:1.55}.sectiontitle{font-size:12px;color:#a7c1d1;letter-spacing:.05em;margin:15px 0 7px;font-weight:700}.hunt{white-space:pre-line;background:#263643;border-radius:8px;padding:10px 12px;font-weight:650}.traits{margin:0;padding-left:20px}.traits li{margin:10px 0;white-space:pre-line}.traits strong{color:#9dd2f0}.evtext{font-size:13px;color:#b8d1de;line-height:1.7}.obtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}.obtable th,.obtable td{border:1px solid #506171;padding:7px 4px;text-align:center}.obtable th{background:#2a3b4b}.calm{color:#9be7bf}.aggr{color:#ffb1ad}.note{font-size:12px;color:#b4c3d0;line-height:1.6}.video-panel{margin-top:9px;border:1px solid #465b6a;border-radius:10px;padding:10px;background:#202e3a}.video-panel video{display:block;width:100%;max-height:340px;background:#080c10;border-radius:7px;margin:9px 0}.video-actions{display:flex;gap:8px;flex-wrap:wrap}.video-actions button{background:#2b4051;color:#fff;border:1px solid #648092;border-radius:7px;padding:8px 12px;font-size:13px}.video-actions button:disabled{opacity:.45}.video-hint{font-size:11px;color:#a9bdca;margin-top:7px}.sheetfoot{font-size:11px;color:#849aab;margin-top:18px}body.sheet-open{overflow:hidden}

<script>
const G=[{"name":"アスワング","evidence":["freezing","writing","dots"],"hunt_line":"５０％","traits":[{"label":"特徴１","text":"移動速度１．５３m/s＋視認加速\n（ツインズのメインとほぼ同じ）"},{"label":"特徴２","text":"視認加速が９秒で最大になる\n（通常１３秒）"},{"label":"特徴３","text":"隠れ場所にいるプレイヤーを殺せず、触れた瞬間ハントが終了する"}]},{"name":"バンシー","evidence":["uv","orbs","dots"],"hunt_line":"ターゲット個人の５０％","traits":[{"label":"特殊能力","text":"ターゲットと同じ階層にいると６６％の確率でターゲットの元へ徘徊する"},{"label":"特徴１","text":"女性の名前と姿でしか出現しない"},{"label":"特徴２","text":"特殊ボイスを聞くことができる"},{"label":"特徴３","text":"ターゲット以外殺されない"},{"label":"特徴４","text":"ターゲットは歌う超常現象の正気度減少量が５％増"},{"label":"特徴５","text":"いつでも長距離徘徊可能でゴーストルーム変更時の距離制限がない（通常は１２m）"}]},{"name":"ダヤン","evidence":["emf5","orbs","spirit_box"],"hunt_line":"（１０m以内に人がいない）５０％\n（１０m以内の人が動いてる）６５％\n（１０m以内の人が静止してる）４５％","traits":[{"label":"特徴１","text":"女性の名前と姿でしか出現しない"},{"label":"特徴２","text":"調査員未検知時＝１．７m/s＋視認加速\n（１０m以内で）\n静止調査員検知時＝１．２m/s固定\n移動調査員検知時＝２．２５m/s固定"}]},{"name":"ディルデガスト","evidence":["emf5","writing","dots"],"hunt_line":"５０％","traits":[{"label":"特徴１","text":"移動速度３．０m/s～０．４m/s\n（動かした物１個につき０．１３m/sずつ低下）"},{"label":"特徴２","text":"視認加速がない"},{"label":"特徴３","text":"プレイヤーがマップ内の配置物を動かした個数で移動速度が低下\n（調査員がハント外で、物体を拾うかインベントリから出す、照明、ブレーカー、蛇口、シャワー、家電、端末などを操作する）"},{"label":"特徴４","text":"移動速度の低下はハント（十字架使用含む）毎にリセットされる"}]},{"name":"デーモン","evidence":["uv","writing","freezing"],"hunt_line":"７０％","traits":[{"label":"特殊能力","text":"正気度を無視してハントを行う"},{"label":"特徴１","text":"浄化香を当てると６０秒間ハントを起こせない（通常９０秒間）"},{"label":"特徴２","text":"２０秒間隔でハントを起こせる（通常２５秒間隔）"},{"label":"特徴３","text":"十字架の効果範囲が１．５倍になる"}]},{"name":"デオヘン","evidence":["spirit_box","writing","dots"],"hunt_line":"４０％","traits":[{"label":"特徴１","text":"スピリットボックスの証拠を隠さない"},{"label":"特徴２","text":"プレイヤーの位置を常に把握している"},{"label":"特徴３","text":"プレイヤーから６m以上離れているとき３m/s\n２．５m以内で０．４m/s"},{"label":"特徴４","text":"確率で特殊ボイスが聞ける"}]},{"name":"ガルル","evidence":["emf5","uv","spirit_box"],"hunt_line":"（通常）５０％\n（激昂）６０％\n（疲弊）４０％","traits":[{"label":"特殊能力","text":"防護装備を使用されると\n通常→激昂 or 疲弊→通常\n激昂中にハントを終えると\n激昂→疲弊"},{"label":"特徴１","text":"激昂時：防護装備の効果減\n（塩踏まない、浄化香短くなる、十字架効果狭くなる。）\n疲弊時：防護装備の効果増\n（浄化香長くなる、十字架効果広くなる。）"},{"label":"特徴２","text":"通常時＝１．７m/s＋視認加速\n激昂時＝１．９５５m/s＋視認加速\n疲弊時＝１．３６m/s＋視認加速"}]},{"name":"御霊","evidence":["emf5","uv","dots"],"hunt_line":"５０％","traits":[{"label":"特徴１","text":"D.O.T.S.プロジェクターの証拠を隠さない"},{"label":"特徴２","text":"ルームを移動しない"},{"label":"特徴３","text":"プレイヤーと同じ部屋でD.O.T.S.プロジェクターの証拠を出さない"},{"label":"特徴４","text":"ビデオカメラ越しのみD.O.T.S.プロジェクターに写る"}]},{"name":"ハントゥ","evidence":["uv","orbs","freezing"],"hunt_line":"５０％","traits":[{"label":"特徴１","text":"氷点下の証拠を出す"},{"label":"特徴２","text":"部屋の温度によって速度が変わる\n０℃以下＝２．７m/s\n１５℃以上＝１．４m/s"},{"label":"特徴３","text":"ブレーカーが落ちているとゴーストが白い息を吐く"},{"label":"特徴４","text":"視認加速がない"},{"label":"特徴５","text":"ブレーカーを上げない"}]},{"name":"ジン","evidence":["emf5","uv","freezing"],"hunt_line":"５０％","traits":[{"label":"特殊能力","text":"同じ部屋にいるプレイヤーの正気度を２５％下げる。（ブレーカーでEMF２を検出する）"},{"label":"特徴１","text":"プレイヤーを視認してから、３m以内まで近づく or 見失うまで速度が２．５m/s固定"},{"label":"特徴２","text":"ブレーカーが落ちていると。特殊能力と特徴１を出せない"},{"label":"特徴３","text":"ブレーカーを下げない"}]},{"name":"コルモス","evidence":["orbs","spirit_box","uv"],"hunt_line":"通常５０%\n（同室走行検知時：７０%）\n","traits":[{"label":"特徴１","text":"調査員を視認できない代わりに足音を検知できる\nしゃがみ＝１０m\n通常歩行＝２０m\n走行＝３０m"},{"label":"特徴２","text":"通常速度＝１．７m/s\n追跡速度＝２．２１m/s\n（５m以内で視認加速が溜まる）"},{"label":"特徴３","text":"追尾系超常現象を行わない"}]},{"name":"メアー","evidence":["spirit_box","orbs","writing"],"hunt_line":"（照明ON）４０％\n（照明OFF）６０％","traits":[{"label":"特殊能力","text":"電気をONにした瞬間OFFにする"},{"label":"特徴１","text":"照明の電源を入れない"},{"label":"特徴２","text":"超常現象で照明を破壊しやすい"},{"label":"特徴３","text":"照明がONの部屋で長距離徘徊可能でゴーストルーム変更時の距離制限がない（通常は１２m）"}]},{"name":"モーロイ","evidence":["spirit_box","writing","freezing"],"hunt_line":"５０％","traits":[{"label":"特殊能力","text":"声を聴いたプレイヤーに呪いをかける\n呪われると正気度減少速度が倍になり、照明がついてても止まらない\n精神安定剤を飲むと解呪される"},{"label":"特徴１","text":"スピリットボックスの証拠を隠さない"},{"label":"特徴２","text":"移動速度が平均正気度依存\n４５％以上　　＝１．５００m/s＋視認加速\n４０％～４５％＝１．５８３m/s＋視認加速\n３５％～４０％＝１．６６０m/s＋視認加速\n３０％～３５％＝１．７４９m/s＋視認加速\n２５％～３０％＝１．８３２m/s＋視認加速\n２０％～２５％＝１．９１５m/s＋視認加速\n１５％～２０％＝１．９９８m/s＋視認加速\n１０％～１５％＝２．０８１m/s＋視認加速\n５％～１０％＝２．１６４m/s＋視認加速\n０％～　５％＝２．２５０m/s＋視認加速"},{"label":"特徴３","text":"浄化香を当てると７秒間見失う\n（通常５秒間）"}]},{"name":"マイリング","evidence":["emf5","uv","writing"],"hunt_line":"５０％","traits":[{"label":"特徴１","text":"足音が１２m以内でしか聞こえない\n（通常２０m）"},{"label":"特徴２","text":"指向性マイクで６４秒ごとに怪奇音が聞ける\n（通常８０秒ごと）"}]},{"name":"化け狐","evidence":["emf5","uv","orbs"],"hunt_line":"５０％","traits":[{"label":"特殊能力","text":"残っている指紋の表示時間を５０％短縮する"},{"label":"特徴１","text":"紫外線の証拠を隠さない"},{"label":"特徴２","text":"紫外線の証拠を２５％の確率で残さない"},{"label":"特徴３","text":"指紋の証拠を残す際１７％の確率で６本指になる"},{"label":"特徴４","text":"特定の点滅回数で同性の別モデルに変身する"}]},{"name":"オバンボ","evidence":["writing","uv","dots"],"hunt_line":"（穏やか）１０％\n（攻撃的）６５％","traits":[{"label":"特徴１","text":"穏やかな状態と攻撃的な状態は玄関扉を開錠して１分後から２分間隔で切り替わる（ハント中でも替わる）"},{"label":"特徴２","text":"穏やかな状態＝１．４４５m/s＋視認加速\n攻撃的な状態＝１．９５５m/s＋視認加速"},{"label":"特徴３","text":"穏やか状態は干渉・超常現象が多い"},{"label":"特徴４","text":"攻撃的な状態はハント時間が２０％短い"}]},{"name":"鬼","evidence":["emf5","freezing","dots"],"hunt_line":"５０％","traits":[{"label":"特徴１","text":"ハント中の実体化時間が長い"},{"label":"特徴２","text":"霧の姿の超常現象をしない"},{"label":"特徴３","text":"超常現象を受けた時の正気度の減少が他ゴーストの２倍"},{"label":"特徴４","text":"超常現象の頻度が高い"}]},{"name":"怨霊","evidence":["spirit_box","orbs","freezing"],"hunt_line":"６０％\n（４m以内に火があると４０％）","traits":[{"label":"特殊能力","text":"3の倍数回火を消すと特殊ハント"},{"label":"特徴１","text":"火が十字架の代わりになる"},{"label":"特徴２","text":"火と十字架が近いと特徴１が優先される"},{"label":"特徴３","text":"火を点けない（ブードゥー人形で強制した場合を除く）"},{"label":"特徴４","text":"死んだプレイヤーが多いほど火を消す頻度が増す"}]},{"name":"ファントム","evidence":["spirit_box","uv","dots"],"hunt_line":"５０％","traits":[{"label":"特殊能力","text":"ランダムにプレイヤーの元へ移動する"},{"label":"特徴１","text":"ハント中消えている時間が長い"},{"label":"特徴２","text":"写真を撮ると姿が消える"},{"label":"特徴３","text":"動画を撮ると姿が消える"},{"label":"特徴４","text":"心音が聞こえるだけで正気度が減る"}]},{"name":"ポルターガイスト","evidence":["spirit_box","uv","writing"],"hunt_line":"５０％","traits":[{"label":"特殊能力","text":"一斉に物を飛ばす・浮かす\n１個当たり２％正気度減\n（特殊能力のためハント中は使用しない）"},{"label":"特徴１","text":"物を遠くまで飛ばす"},{"label":"特徴２","text":"ハント中０．５秒ごとに１００％物を投げる\n（通常０．５秒ごとに５０％）"}]},{"name":"雷獣","evidence":["emf5","orbs","dots"],"hunt_line":"５０％\n（周囲に電子機器があると）６５％","traits":[{"label":"特徴１","text":"電子機器の２．４m以内で２．５m/s固定"},{"label":"特徴２","text":"電子機器の誤作動範囲が１５m（通常１０m）"},{"label":"特徴３","text":"心音の発生距離が１５m（通常１０m）"}]},{"name":"レヴナント","evidence":["orbs","writing","freezing"],"hunt_line":"５０％","traits":[{"label":"特徴１","text":"通常時＝１．０m/s\n調査員を感知時＝３．０m/s"},{"label":"特徴２","text":"視認加速をしない"}]},{"name":"シェード","evidence":["emf5","orbs","freezing"],"hunt_line":"３５％","traits":[{"label":"特徴１","text":"プレイヤーと同じ部屋で干渉・超常現象・自然ハントを行わない"},{"label":"特徴２","text":"魔法陣・オルゴールを使用時、影の姿で出現することがある"},{"label":"特徴３","text":"歌う超常現象をしない"}]},{"name":"スピリット","evidence":["emf5","spirit_box","writing"],"hunt_line":"５０％","traits":[{"label":"特徴","text":"浄化香を当てると１８０秒間ハントを起こせない（通常９０秒）"}]},{"name":"セーイ","evidence":["orbs","writing","dots"],"hunt_line":"７４％～１４％","traits":[{"label":"特殊能力","text":"プレイヤーと同じ部屋にいると老化する\n（１分～２分毎に老化判定がある）"},{"label":"特徴１","text":"老化するたび６％ずつハントラインが低下する"},{"label":"特徴２","text":"移動速度２．７５m/s～１．０m/s\n（老化によって０．１７５m/sずつ遅くなる）"},{"label":"特徴３","text":"老化する前後でウィジャ盤で聞いた年齢が変化する"},{"label":"特徴４","text":"視認加速をしない"}]},{"name":"ミミック","evidence":["spirit_box","uv","freezing"],"hunt_line":"真似ているゴースト依存","traits":[{"label":"特殊能力","text":"調査開始から３０秒～２分ごとにランダムで他のゴーストを真似する"},{"label":"特徴","text":"必ずゴーストオーブを出す\n（証拠０でも出す）"}]},{"name":"ツインズ","evidence":["emf5","spirit_box","freezing"],"hunt_line":"５０％","traits":[{"label":"特殊能力","text":"一定確率で干渉範囲より広範囲で干渉を起こす"},{"label":"特徴","text":"（メイン）１．５m/s＋視認加速\n（サブ）１．９m/s＋視認加速"}]},{"name":"レイス","evidence":["emf5","spirit_box","dots"],"hunt_line":"５０％","traits":[{"label":"特殊能力","text":"プレイヤーの元にワープする\n（EMF２の反応を検出）"},{"label":"特徴","text":"塩を踏まない"}]},{"name":"妖怪","evidence":["spirit_box","orbs","dots"],"hunt_line":"５０％\n（同じ部屋でVCや無線利用時）８０％","traits":[{"label":"特徴","text":"ハント中２．５m以内の電子機器や声にしか反応しない\n（通常９m）"}]},{"name":"幽霊","evidence":["orbs","freezing","dots"],"hunt_line":"５０％","traits":[{"label":"特殊能力","text":"扉を完全に開けるか完全に閉めた時近くにいる人の正気度を１５％減"},{"label":"特徴１","text":"扉を少し動かすことができない"},{"label":"特徴２","text":"浄化香を当てると９０秒間ゴーストルームからでなくなる"}]}];
const ICON={

writing:'<path d="M3 5q5-2 9 1 4-3 9-1v14q-5-2-9 1-4-3-9-1zM12 6v14M5 9h4M15 9h4M5 13h4M15 13h4"/>',

const E=[['emf5','EMF5'],['uv','紫外線'],['writing','ライティング'],['freezing','氷点下'],['dots','DOTS'],['orbs','オーブ'],['spirit_box','スピボ']];
const keys=E.map(e=>e[0]);
function fresh(){return Object.fromEntries(keys.map(k=>[k,0]))}
let state=fresh();try{const saved=JSON.parse(localStorage.getItem('pjEvidence'));if(saved&&typeof saved==='object')for(const k of keys)if([0,1,2].includes(saved[k]))state[k]=saved[k]}catch(e){}
const evidence=document.getElementById('evidence'),ghosts=document.getElementById('ghosts');
function matches(g){return keys.every(k=>{const has=g.evidence.includes(k)||(g.name==='ミミック'&&k==='orbs');return state[k]===0||(state[k]===1?has:!has)})}
function render(){evidence.replaceChildren();for(const [key,label] of E){const b=document.createElement('button');b.type='button';b.className='ev '+(state[key]===1?'yes':state[key]===2?'no':'');b.setAttribute('aria-label',label+'：'+['未確認','確認','除外'][state[key]]);b.setAttribute('aria-pressed',state[key]===1?'true':'false');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[key]+'</svg><small'+(key==='writing'?' class="writing-label"':'')+'>'+label+'</small>';b.onclick=()=>{state[key]=(state[key]+1)%3;try{localStorage.setItem('pjEvidence',JSON.stringify(state))}catch(e){}render()};evidence.append(b)}const list=G.filter(matches);document.getElementById('count').textContent='候補 '+list.length+'体';ghosts.replaceChildren();if(!list.length){const d=document.createElement('div');d.className='empty';d.textContent='一致するゴーストがいません。証拠を確認してください。';ghosts.append(d)}for(const g of list){const b=document.createElement('button');b.type='button';b.className='ghost';b.textContent=g.name;b.onclick=()=>openSheet(g);ghosts.append(b)}}
const sheet=document.getElementById('sheet'),overlay=document.getElementById('overlay'),sheetBody=document.getElementById('sheetBody');let previousFocus=null;let activeVideo=null;const VIDEO_FILES={'鬼':'ONI2.mp4','ファントム':'PHAMTOM.mp4','化け狐':'OBAKE2.mp4'};function unloadVideo(){if(!activeVideo)return;activeVideo.pause();activeVideo.removeAttribute('src');activeVideo.load();activeVideo=null;}
function section(title){const h=document.createElement('div');h.className='sectiontitle';h.textContent=title;sheetBody.append(h)}
function openSheet(g){unloadVideo();previousFocus=document.activeElement;document.getElementById('sheetTitle').textContent=g.name;sheetBody.replaceChildren();section('ハントライン');const hunt=document.createElement('div');hunt.className='hunt';hunt.textContent=g.hunt_line||'記載なし';sheetBody.append(hunt);section('特徴・特殊能力');const ul=document.createElement('ul');ul.className='traits';for(const t of g.traits){const li=document.createElement('li');const strong=document.createElement('strong');strong.textContent=t.label+'：';li.append(strong,document.createTextNode(t.text));ul.append(li)}sheetBody.append(ul);section('証拠');const ev=document.createElement('div');ev.className='evtext';ev.textContent=g.evidence.map(k=>E.find(e=>e[0]===k)?.[1]||k).join(' / ')+(g.name==='ミミック'?' ＋ オーブ（追加証拠）':'');sheetBody.append(ev);if(g.name==='オバンボ')obambo();if(VIDEO_FILES[g.name])addVideo(g);const foot=document.createElement('div');foot.className='sheetfoot';foot.textContent='Discordのゴースト特徴スレッドから収録';sheetBody.append(foot);sheetBody.scrollTop=0;sheet.classList.add('open');overlay.classList.add('open');sheet.setAttribute('aria-hidden','false');document.body.classList.add('sheet-open');document.getElementById('close').focus()}
function closeSheet(){unloadVideo();sheet.classList.remove('open');overlay.classList.remove('open');sheet.setAttribute('aria-hidden','true');document.body.classList.remove('sheet-open');previousFocus?.focus?.()}
function addVideo(g){section('判別用動画');const panel=document.createElement('div');panel.className='video-panel';const description=document.createElement('div');description.className='note';description.textContent=({'鬼':'鬼の点滅','ファントム':'ファントムの点滅','化け狐':'化け狐のゴーストシェイプ'})[g.name];panel.append(description);const video=document.createElement('video');video.controls=true;video.playsInline=true;video.loop=true;video.preload='none';video.setAttribute('playsinline','');video.src='videos/'+VIDEO_FILES[g.name];panel.append(video);activeVideo=video;const actions=document.createElement('div');actions.className='video-actions';const stop=document.createElement('button');stop.type='button';stop.textContent='■ 停止';stop.disabled=true;video.addEventListener('play',()=>{stop.disabled=false});stop.onclick=()=>{video.pause();try{video.currentTime=0}catch(e){}stop.disabled=true};actions.append(stop);panel.append(actions);const hint=document.createElement('div');hint.className='video-hint';hint.textContent='動画内の▶ボタンで再生・一時停止できます。再生後は停止ボタンを押すか詳細を閉じるまでループします。';panel.append(hint);sheetBody.append(panel)}
document.getElementById('close').onclick=closeSheet;overlay.onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('open'))closeSheet();if(e.key==='Tab'&&sheet.classList.contains('open')){const btn=document.getElementById('close');if(document.activeElement!==btn){e.preventDefault();btn.focus()}}});
let touchStart=null;sheet.addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});sheet.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(dx>75&&Math.abs(dx)>Math.abs(dy)*1.4)closeSheet();touchStart=null},{passive:true});
function obambo(){section('状態切り替え目安表');const p=document.createElement('p');p.className='note';p.textContent='玄関扉を開錠した時点を0:00として手動で確認。1:00から2分ごとに切り替わる（ハント中も切り替わる）。';sheetBody.append(p);const table=document.createElement('table');table.className='obtable';table.innerHTML='<thead><tr><th>経過時間</th><th>状態</th><th>ハントライン</th></tr></thead>';const tb=document.createElement('tbody');for(let i=0;i<16;i++){const start=i===0?0:2*i-1,end=i===0?1:2*i+1,calm=i%2===0;const tr=document.createElement('tr');for(const [value,cls] of [[`${start}:00 ～ ${end}:00`,''],[calm?'穏やか':'攻撃的',calm?'calm':'aggr'],[calm?'10%':'65%','']]){const td=document.createElement('td');td.textContent=value;if(cls)td.className=cls;tr.append(td)}tb.append(tr)}table.append(tb);sheetBody.append(table)}
document.getElementById('resetEvidence').onclick=()=>{state=fresh();try{localStorage.removeItem('pjEvidence')}catch(e){}render()};
let elapsed=0,started=null;const clockNow=()=>performance.now();const time=document.getElementById('time');function drawTime(){const ms=Math.max(0,elapsed+(started===null?0:clockNow()-started));time.textContent=String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+Math.floor(ms/100)%10}document.getElementById('start').onclick=()=>{if(started===null)started=clockNow();drawTime()};document.getElementById('stop').onclick=()=>{if(started!==null){elapsed+=clockNow()-started;started=null;drawTime()}};document.getElementById('clear').onclick=()=>{elapsed=0;started=null;drawTime()};setInterval(drawTime,100);render();drawTime();
</script></body></html>
