<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151c"><title>Phasmo Journal</title><style>*{box-sizing:border-box}body{margin:0;background:#10151c;color:#e7ebef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{position:sticky;top:0;background:#171e27;z-index:3;padding:12px 14px;border-bottom:1px solid #33404c}header .top{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:17px;margin:0;letter-spacing:.04em}.time{font-variant-numeric:tabular-nums;font-size:27px;font-weight:750;letter-spacing:.05em}.controls{display:flex;gap:7px;align-items:center}button{font:inherit;cursor:pointer}header button,.reset{border:1px solid #4b5c6b;background:#26313d;color:#fff;border-radius:8px;padding:8px 11px;font-size:12px}.primary{background:#29634e!important;border-color:#40936d!important}main{padding:13px 12px 160px;max-width:750px;margin:auto}.summary{display:flex;align-items:center;justify-content:space-between;color:#a9b8c6;font-size:13px;margin-bottom:10px}.ghost{border:1px solid #35424e;border-radius:10px;background:#1b242e;margin-bottom:7px;overflow:hidden}.ghost>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 15px;background:transparent;border:0;color:#f0f3f6;text-align:left;font-weight:650;font-size:16px}.ghost>button span:last-child{color:#91a2b1}.details{border-top:1px solid #34424f;padding:8px 16px 13px;color:#c9d3dc;font-size:14px}.details ul{margin:6px 0;padding-left:18px}.details li{margin:7px 0;line-height:1.45}.evidence-list{font-size:12px;color:#8fabb9}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#171e27;border-top:1px solid #3b4956;padding:9px 7px calc(9px + env(safe-area-inset-bottom))}.evidence{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:750px;margin:auto}.ev{position:relative;min-width:0;height:65px;border:1px solid #536170;border-radius:7px;background:#26313c;color:#dce4ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;overflow:hidden}.ev .symbol{font-size:24px;line-height:1}.ev small{font-size:9px;white-space:nowrap}.ev.yes{color:#85e2a4;border-color:#4db97d;background:#1a392e}.ev.no{color:#6e7b88;border-color:#59616b;background:#20272f}.ev.no:after{content:'';position:absolute;left:-13%;top:50%;width:126%;height:3px;background:#e46a6a;transform:rotate(-45deg);box-shadow:0 0 1px #000}.resetrow{max-width:750px;margin:7px auto 0;display:flex;justify-content:space-between;align-items:center;color:#8c9baa;font-size:11px}.reset{padding:4px 9px}.obtable{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0}.obtable th,.obtable td{border:1px solid #42515f;padding:7px;text-align:center}.obtable th{background:#263441}.calm{color:#91d6b5}.aggr{color:#f4a6a6}.note{font-size:11px;color:#aab6c2;line-height:1.5}.empty{padding:30px 10px;text-align:center;color:#a9b8c6}@media(max-width:370px){.ev{height:60px}.ev .symbol{font-size:21px}.ev small{font-size:8px}.time{font-size:23px}header button{padding:7px 8px}}</style></head><body><header><div class="top"><div><h1>GHOST JOURNAL</h1><div class="time" id="time">00:00.0</div></div><div class="controls"><button id="start" class="primary">開始</button><button id="stop">停止</button><button id="clear">リセット</button></div></div></header><main><div class="summary"><span id="count">候補 30体</span><span>ゴースト名をタップで特徴表示</span></div><div id="ghosts"></div></main><footer class="bottom"><div class="evidence" id="evidence"></div><div class="resetrow"><span>タップ：未確認 → 確認 → 除外</span><button class="reset" id="resetEvidence">証拠をリセット</button></div></footer><script>
const E=[['emf','EMF5','⚡'],['uv','紫外線','✋'],['writing','ライティング','✎'],['freezing','氷点下','❄'],['dots','DOTS','◌'],['orbs','オーブ','◉'],['box','スピボ','▣']];
const G=[
['アスワング','writing freezing dots','視認されると急激に加速する','正規の隠れ場所にいるプレイヤーを殺せない'],['バンシー','uv orbs dots','特定のプレイヤーをターゲットにする','パラボラマイクで固有の叫び声'],['デイヤン','emf orbs box','近くのプレイヤーが動くと速くなる','近くのプレイヤーが止まると遅くなる'],['デイルデガスト','emf writing dots','物に干渉するほどハント速度が低下','序盤は非常に速い'],['デーモン','uv writing freezing','高い正気度でもハントすることがある','ハント間隔が短い'],['デオヘン','box writing dots','ハント中にプレイヤーの位置を把握する','近距離で極端に遅くなる'],['ガル','emf uv box','防御アイテムへの反応が特殊','十字架や浄化香への反応を観察'],['ゴリョウ','emf uv dots','DOTSはカメラ越しで確認','DOTS観測時に人が近くにいない必要がある'],['ハントゥ','uv orbs freezing','寒い場所ほど速くなる','ハント中に低温で白い息が見える'],['ジン','emf uv freezing','ブレーカーON時に条件付きで加速','ブレーカーを直接切らない'],['コルモス','orbs box uv','特殊な行動に注意','詳細な判別条件は要検証'],['メアー','box orbs writing','暗い場所ではハントしやすい','照明を即座に消すことがある'],['モーロイ','box writing freezing','正気度が低いほど速い','スピボ・パラボラで呪いをかける'],['マイリング','emf uv writing','ハント中の足音が近距離まで聞こえにくい'],['オバケ','emf uv orbs','特殊な紫外線の跡を残すことがある','ハント中に一瞬だけ姿が変わる'],['オバンボ','uv writing dots','穏やか・攻撃的の2状態がある','状態でハント条件と速度が変化する'],['鬼','emf freezing dots','ハント中に姿が見える時間が長い','エアボールのゴーストイベントを起こさない'],['怨霊','box orbs freezing','炎が消えるとハントを試みることがある','火を使って検証できる'],['ファントム','box uv dots','写真撮影で姿が消える','ハント中の点滅で姿が見えにくい'],['ポルターガイスト','box uv writing','複数の物を一度に投げることがある','物をよく投げる'],['雷獣','emf orbs dots','稼働中の電子機器付近で加速','電子機器の近くでは早くハントする'],['レヴナント','orbs writing freezing','プレイヤーを認識すると非常に速い','認識していないと遅い'],['シェード','emf writing freezing','プレイヤーと同じ部屋ではハントしない','活動が比較的少ない'],['スピリット','emf box writing','浄化香を当てると180秒間ハントできない'],['セーイ','orbs writing dots','序盤は速くハントしやすい','プレイヤーの近くで時間とともに老化する'],['ミミック','box uv freezing','他のゴーストの特徴を模倣する','通常証拠とは別にゴーストオーブが出る'],['ツインズ','emf box freezing','ハント開始位置で速度が異なる','遠隔干渉を起こす'],['レイス','emf box dots','塩を踏まない','プレイヤー付近にテレポートする'],['妖怪','box orbs dots','近くで話すとハントしやすくなる','ハント中の聴覚範囲が狭い'],['幽霊','orbs freezing dots','ドアを完全に閉めて正気度を減らす能力','浄化香で部屋に留めやすい']
].map(([name,ev,...traits])=>({name,ev:ev.split(' '),traits}));
let state=JSON.parse(localStorage.getItem('pjEvidence')||'null')||Object.fromEntries(E.map(x=>[x[0],0]));let expanded=new Set();const evidence=document.getElementById('evidence'),ghosts=document.getElementById('ghosts');
function matches(g){return E.every(([k])=>{let has=g.ev.includes(k)||(g.name==='ミミック'&&k==='orbs');return state[k]===0||(state[k]===1?has:!has)})}
function render(){evidence.innerHTML='';E.forEach(([key,label,sym])=>{let b=document.createElement('button');b.className='ev '+(state[key]===1?'yes':state[key]===2?'no':'');b.setAttribute('aria-label',label+' '+['未確認','確認','除外'][state[key]]);b.innerHTML=`<span class="symbol">${sym}</span><small>${label}</small>`;b.onclick=()=>{state[key]=(state[key]+1)%3;localStorage.setItem('pjEvidence',JSON.stringify(state));render()};evidence.append(b)});let list=G.filter(matches);document.getElementById('count').textContent='候補 '+list.length+'体';ghosts.innerHTML='';if(!list.length){ghosts.innerHTML='<div class="empty">一致するゴーストがいません。証拠を確認してください。</div>';return}list.forEach(g=>{let item=document.createElement('section');item.className='ghost';let btn=document.createElement('button');btn.innerHTML=`<span>${g.name}</span><span>${expanded.has(g.name)?'⌃':'⌄'}</span>`;btn.onclick=()=>{expanded.has(g.name)?expanded.delete(g.name):expanded.add(g.name);render()};item.append(btn);if(expanded.has(g.name)){let detail=document.createElement('div');detail.className='details';let ul=document.createElement('ul');g.traits.forEach(t=>{let li=document.createElement('li');li.textContent=t;ul.append(li)});detail.append(ul);if(g.name==='オバンボ'){let h=document.createElement('div');h.innerHTML='<strong>状態切り替え目安表</strong><div class="note">玄関を最初に開けてからの経過時間。ゲーム内でズレる場合があるため手動で判断。</div>';let table=document.createElement('table');table.className='obtable';table.innerHTML='<thead><tr><th>経過時間</th><th>状態</th></tr></thead>';let tbody=document.createElement('tbody');for(let i=0;i<16;i++){let start=i===0?0:2*i-1,end=i===0?1:2*i+1,calm=i%2===0;let tr=document.createElement('tr');tr.innerHTML=`<td>${start}:00 ～ ${end}:00</td><td class="${calm?'calm':'aggr'}">${calm?'穏やか':'攻撃的'}</td>`;tbody.append(tr)}table.append(tbody);h.append(table);detail.append(h)}let meta=document.createElement('div');meta.className='evidence-list';meta.textContent='証拠：'+g.ev.map(k=>E.find(e=>e[0]===k)[1]).join(' / ')+(g.name==='ミミック'?' ＋ オーブ（追加）':'');detail.append(meta);item.append(detail)}ghosts.append(item)})}
document.getElementById('resetEvidence').onclick=()=>{state=Object.fromEntries(E.map(x=>[x[0],0]));localStorage.removeItem('pjEvidence');expanded.clear();render()};
let elapsed=0,started=null;const time=document.getElementById('time');function drawTime(){let ms=started===null?elapsed:elapsed+Date.now()-started;let tenths=Math.floor(ms/100)%10,sec=Math.floor(ms/1000)%60,min=Math.floor(ms/60000);time.textContent=String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+tenths}document.getElementById('start').onclick=()=>{if(started===null)started=Date.now();drawTime()};document.getElementById('stop').onclick=()=>{if(started!==null){elapsed+=Date.now()-started;started=null;drawTime()}};document.getElementById('clear').onclick=()=>{elapsed=0;started=null;drawTime()};setInterval(drawTime,100);render();drawTime();
</script></body></html>
